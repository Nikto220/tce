[project]
name = "nnue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikto220", email = "l.kot@azailowa.pozytywneinicjatywy.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "torch>=2.14.1",
]

[project.scripts]
nnue = "nnue.train:main"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.uv.sources]
torch = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[tool.maturin]
python-source = "./src"
module-name = "nnue.fastdata"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/*.rs" },
    { file = "src/**/*.rs" },
    { file = "src/**/*.py" },
]
